name: sonora
description: 低延迟原生录音插件（类似 record），支持 iOS / Android，含实时振幅流；不含 UI。
version: 0.0.1
publish_to: "none"

environment:
  sdk: ">=3.1.2 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.sonora
        pluginClass: SonoraPlugin
      ios:
        pluginClass: SonoraPlugin
